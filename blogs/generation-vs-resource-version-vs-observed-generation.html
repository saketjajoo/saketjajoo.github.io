    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <!-- Google tag (gtag.js) -->

</head>

<body>
  <header class="blog-header container">
    <a href="../blog.html" class="home-link no-highlight">← All Blogs</a>
  </header>

  <main id="content" class="blog-content container">
    <p>Loading post...</p>
  </main>

  <script>

    const postName = window.location.pathname.split('/').pop().replace('.html', '');
    const markdownPath = `./posts/${postName}.md`;

    fetch(markdownPath)
      .then(response => {
        if (!response.ok) throw new Error(`Could not find ${markdownPath}`);
        return response.text();
      })
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
        document.querySelectorAll('pre code').forEach(block => {
          hljs.highlightElement(block);
        });

        try {
          mermaid.run();
        } catch (e) {
          console.error("Mermaid.js run error:", e);
        }
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <p style="color:#888;text-align:center;">⚠️ Could not load this post.<br><small>${err.message}</small></p>
        `;
        console.error(err);
      });
  </script>
</body>
</html>
